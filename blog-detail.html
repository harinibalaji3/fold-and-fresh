<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article | Fold & Fresh Journal</title>
<meta name="description" content="Read the full article from the Fold & Fresh journal.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#f3f9f7;--panel:#ffffff;--ink:#0e2a2b;--ink2:#4b6664;--teal:#0E6369;--teal-d:#083f44;--aqua:#3BB0A4;--coral:#ff8a5c;--coral-d:#e26a3d;--line:#d7e6e2;--ok:#2f8f5b;--warn:#c96a1f;--bad:#d1493f;--r:14px;--wrap:1180px;--fh:'Plus Jakarta Sans',system-ui,sans-serif;--fb:'Source Sans 3',system-ui,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.65 var(--fb);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em;font-weight:800;color:var(--teal-d)}
h1{font-size:clamp(2.4rem,5.4vw,4.2rem)}h2{font-size:clamp(1.7rem,3.2vw,2.5rem)}h3{font-size:1.22rem}h4{font-size:1.02rem}
p{margin:0 0 1em}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 1.25rem}
  /* Layout Structure */
  .blog-layout { display: grid; grid-template-columns: 1fr 300px; gap: 3rem; padding: 2.5rem 0 4rem; }
  @media (max-width: 850px) { .blog-layout { grid-template-columns: 1fr; } }

  /* Main Article Styling */
  .post-header { margin-bottom: 2rem; }
  .post-crumbs { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
  .post-crumbs a { color: var(--accent-color); text-decoration: none; }
  .post-cat { display: inline-block; background: var(--section-alt-bg); border: 1px solid var(--border-color); color: var(--accent-color); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; padding: 0.3rem 0.8rem; border-radius: 20px; margin-bottom: 1rem; }
  .post-title { font-size: 2.5rem; margin: 0 0 1rem 0; line-height: 1.25; color: var(--text-main); }
  .post-meta { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem; }
  
  .post-hero-img { width: 100%; height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 2rem; }
  
  .post-body p { font-size: 1.1rem; line-height: 1.7; color: var(--text-main); margin-bottom: 1.5rem; }

  /* Sidebar Styling */
  .side h3 { font-size: 1.1rem; border-bottom: 2rem; margin: 0 0 1rem 0; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
  .side ul { list-style: none; padding: 0; margin: 0 0 2rem 0; }
  .side li { margin-bottom: 0.75rem; }
  .side a { color: var(--text-main); text-decoration: none; transition: color 0.2s; font-size: 0.95rem; }
  .side a:hover { color: var(--accent-color); }

  .panel { background: var(--section-alt-bg); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 12px; margin-top: 1rem; }
  .panel .small { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1rem; }
  .btn { display: inline-block; background: var(--accent-color); color: #fff; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

  /* Related Section */
  .section.alt { background: var(--section-alt-bg); padding: 3rem 0; border-top: 1px solid var(--border-color); }
  .related { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
  @media (max-width: 850px) { .related { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 550px) { .related { grid-template-columns: 1fr; } }
  
  .related-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; }
  .related-card:hover { transform: translateY(-3px); }
  .related-img { width: 100%; height: 160px; object-fit: cover; }
  .related-body { padding: 1rem; }
  .related-title { font-size: 1rem; font-weight: 700; margin: 0 0 0.5rem 0; line-height: 1.3; }
</style>
</head>
<body data-page="post">
<a class="skip" href="#main">Skip to content</a>

<!-- NAVBAR HEADER -->
<header class="site-header">
  <div class="wrap header-wrap">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="Brand Logo" width="38" height="38">
      <span class="logo-text">FoldFresh</span>
    </a>
    
    <nav class="nav-container">
      <div class="nav-menu-drawer" id="navMenuDrawer">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="home-niche.html">Home 2</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Service</a></li>
          <li><a href="blog.html" class="is-active">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="header-actions">
          <button class="icon-btn theme-toggle" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <button class="pill-toggle-btn rtl-toggle" id="rtlToggleBtn" aria-label="Toggle RTL Direction">RTL</button>

          <div class="profile-dropdown-wrapper">
            <button class="icon-btn profile-btn" id="profileDropdownBtn" aria-label="User Account Menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>

            <div class="profile-dropdown-menu" id="profileDropdownMenu">
              <div class="dropdown-header">
                <h4>FoldFresh</h4>
              </div>
              <ul class="dropdown-links">
                <li><a href="login.html">Login</a></li>
                <li><a href="login.html">Signup</a></li>

            </div>
          </div>
        </div>
      </div>

      <button class="nav-toggle" id="navToggleBtn" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap blog-layout">
    <article id="article"></article>
    
    <aside class="side" aria-label="Sidebar">
      <h3>Categories</h3>
      <ul id="sideCats"></ul>
      
      <h3>Recent posts</h3>
      <ul id="sideRecent"></ul>
      
      <div class="panel">
        <h3 style="border:0;margin:0 0 .4rem">First booking?</h3>
        <p class="small">New customers save 15% on their first wash & fold order.</p>
        <a class="btn btn-sm" href="book.html">Book a pickup</a>
      </div>
    </aside>
  </div>

  <section class="section alt">
    <div class="wrap">
      <h2 style="font-size:1.7rem">Related articles</h2>
      <div class="related" id="relatedPosts"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Get current post ID from URL parameters
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    const postsData = (typeof POSTS !== "undefined") ? POSTS : [];
    
    // Find the requested post or default to the first post
    let post = postsData.find(p => p.id === postId);
    if (!post && postsData.length > 0) {
      post = postsData[0];
    }

    const articleEl = document.getElementById("article");

    if (!post) {
      articleEl.innerHTML = `
        <h2>Article Not Found</h2>
        <p>Sorry, the article you are looking for does not exist.</p>
        <a href="blog.html" class="btn">Back to Journal</a>
      `;
      return;
    }

    // Set page title dynamically
    document.title = `${post.title} | Fold & Fresh Journal`;

    // Resolve Image URL
    const imageUrl = (typeof U === "function" && post.img) ? U(post.img) : post.img;

    // Render Main Article Content
    articleEl.innerHTML = `
      <div class="post-header">
        <div class="post-crumbs"><a href="index.html">Home</a> / <a href="blog.html">Journal</a> / Detail</div>
        <span class="post-cat">${post.cat}</span>
        <h1 class="post-title">${post.title}</h1>
        <div class="post-meta">
          <span>By <strong>${post.author || "FoldFresh Team"}</strong></span>
          <span>•</span>
          <time datetime="${post.date}">${post.date}</time>
        </div>
      </div>
      <img src="${imageUrl}" alt="${post.title}" class="post-hero-img">
      <div class="post-body">
        ${Array.isArray(post.body) 
          ? post.body.map(paragraph => `<p>${paragraph}</p>`).join('') 
          : `<p>${post.excerpt || post.body}</p>`}
      </div>
    `;

    // 2. Render Sidebar Categories
    const sideCatsEl = document.getElementById("sideCats");
    if (sideCatsEl) {
      const categorySet = new Set(postsData.map(p => p.cat).filter(Boolean));
      sideCatsEl.innerHTML = Array.from(categorySet).map(cat => `
        <li><a href="blog.html">${cat}</a></li>
      `).join('');
    }

    // 3. Render Sidebar Recent Posts
    const sideRecentEl = document.getElementById("sideRecent");
    if (sideRecentEl) {
      sideRecentEl.innerHTML = postsData.slice(0, 4).map(p => `
        <li>
          <a href="blog-detail.html?id=${p.id}">${p.title}</a>
        </li>
      `).join('');
    }

    // 4. Render Related Articles
    const relatedPostsEl = document.getElementById("relatedPosts");
    if (relatedPostsEl) {
      const related = postsData.filter(p => p.id !== post.id).slice(0, 3);
      relatedPostsEl.innerHTML = related.map(rel => {
        const relImg = (typeof U === "function" && rel.img) ? U(rel.img) : rel.img;
        return `
          <a href="blog-detail.html?id=${rel.id}" class="related-card">
            <img src="${relImg}" alt="${rel.title}" class="related-img">
            <div class="related-body">
              <h4 class="related-title">${rel.title}</h4>
              <p style="font-size:0.85rem; color: var(--text-muted); margin:0;">${rel.date}</p>
            </div>
          </a>
        `;
      }).join('');
    }
  });
</script>
</body>
</html>
